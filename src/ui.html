<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--btn:#f6f8fa;--btn-bd:#d1d9e0;--accent:#1f6feb;--accent-fg:#ffffff;--page-bd:#d1d9e0;--well:#eff2f5;--warn:#9a6700;--err:#d1242f;color-scheme:light}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--btn:#21262d;--btn-bd:#3d444d;--accent:#4493f8;--accent-fg:#0d1117;--page-bd:#3d444d;--well:#161b22;--warn:#d29922;--err:#f85149;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font:14px system-ui,sans-serif;margin:8px}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sep{flex:1}
button,.file{padding:4px 10px;border:1px solid var(--btn-bd);border-radius:6px;background:var(--btn);color:var(--fg);cursor:pointer;font:inherit}
button:disabled{opacity:.5;cursor:default}
button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.file input{display:none}
.ctl{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.ctl input[type=number]{width:52px;font:inherit;padding:2px 4px;border:1px solid var(--btn-bd);border-radius:4px;background:var(--bg);color:var(--fg)}
#tray{display:inline-flex;gap:4px;align-items:center}
.chip{position:relative;padding:2px;width:40px;height:32px;display:inline-flex;align-items:center;justify-content:center}
.chip img{max-width:34px;max-height:26px;display:block}
.chip .x{position:absolute;top:-7px;right:-7px;width:16px;height:16px;padding:0;border-radius:8px;font-size:11px;line-height:14px;display:none}
.chip:hover .x,.chip:focus-within .x{display:block}
#st{color:var(--muted);width:100%;min-height:1.2em}
#st.warn{color:var(--warn)}#st.err{color:var(--err)}
#info{color:var(--muted);font-size:12px;min-height:1.2em;margin-top:2px}
#pages{margin-top:4px;max-height:680px;overflow:auto;background:var(--well);border:1px solid var(--page-bd);border-radius:6px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
#pages:empty{display:none}
.page{position:relative;width:100%;max-width:860px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);line-height:0}
.page canvas{width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;cursor:copy;touch-action:none;overflow:hidden}
.layer.nostamp{cursor:default}
.pno{position:absolute;right:6px;bottom:4px;font:11px system-ui;line-height:1;color:#57606a;background:rgba(255,255,255,.8);padding:2px 4px;border-radius:3px;pointer-events:none}
.ghost{position:absolute;opacity:.45;pointer-events:none;outline:1px dashed var(--accent)}
.stamp{position:absolute;cursor:move;touch-action:none}
.stamp img{width:100%;height:100%;display:block;pointer-events:none;user-select:none}
.stamp.sel{outline:2px solid var(--accent);outline-offset:1px}
.stamp .h{position:absolute;right:-7px;bottom:-7px;width:12px;height:12px;background:var(--accent);border:2px solid #fff;border-radius:50%;cursor:nwse-resize;display:none}
.stamp .del{position:absolute;right:-9px;top:-9px;width:18px;height:18px;padding:0;border-radius:9px;font:12px/16px system-ui;display:none;background:var(--err);color:#fff;border:1px solid #fff}
.stamp.sel .h,.stamp.sel .del{display:block}
#hint{margin-top:4px;border:1px dashed var(--btn-bd);border-radius:6px;padding:40px 12px;text-align:center;color:var(--muted);line-height:1.6}
#hint[hidden]{display:none}
</style></head><body>
<div id="bar">
<label class="file"><input type="file" id="file" accept="application/pdf,image/png,image/jpeg,image/webp"><span data-i18n="open"></span></label>
<span id="tray"></span>
<label class="file" id="addLbl"><input type="file" id="stampFile" accept="image/png,image/jpeg,image/webp"><span data-i18n="addStamp"></span></label>
<label class="ctl"><input type="checkbox" id="bg" checked><span data-i18n="removeBg"></span></label>
<label class="ctl"><span data-i18n="size"></span><input type="number" id="size" min="5" max="80" step="1" value="15"><span>mm</span></label>
<button id="undo" data-i18n="undo" disabled></button><button id="export" data-i18n="export" disabled></button>
<span class="sep"></span>
<button id="lang" title="Language / 언어"></button><button id="theme"></button>
<span id="st"></span></div>
<div id="hint" data-i18n="hint"></div>
<div id="pages"></div>
<div id="info"></div>
<script type="module">/*BUNDLE*/</script></body></html>
